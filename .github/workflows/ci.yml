name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt pytest pip-audit
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt || true   # informe de vulnerabilidades

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: edumaster, POSTGRES_PASSWORD: edumaster, POSTGRES_DB: edumaster }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    env: { DATABASE_URL: "postgresql+psycopg://edumaster:edumaster@localhost:5432/edumaster" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: alembic upgrade head && python -m app.seed && alembic check

  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt pytest
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: [api, ml, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Escaneo de imágenes (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "edumaster/api:latest", severity: "CRITICAL,HIGH", exit-code: "1" }
